name: Build ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Public safety check
        run: make public-check

      - name: Build ISO
        run: nix build .#nixosConfigurations.iso-minimal.config.system.build.isoImage

      - name: Prepare stable ISO name
        run: |
          mkdir -p dist
          cp result/iso/*.iso dist/runmeHaNix-latest.iso
          ls -lh dist/runmeHaNix-latest.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: runmeHaNix-iso
          path: dist/runmeHaNix-latest.iso
          retention-days: 14

      - name: Publish latest ISO release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest runmeHaNix ISO
          body: |
            Latest public-safe runmeHaNix ISO built from main.

            Download: runmeHaNix-latest.iso
          prerelease: true
          files: dist/runmeHaNix-latest.iso
          fail_on_unmatched_files: true
          overwrite_files: true
